<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GastoZero — Controle de assinaturas</title>
    <meta
      name="description"
      content="GastoZero: controle e conscientização financeira de gastos recorrentes e serviços por assinatura."
    />
    <meta name="theme-color" content="#f1f3ef" />
    <script>
      // Aplica o tema antes do React montar, evitando o flash claro no modo escuro.
      try {
        var pref = JSON.parse(localStorage.getItem("gastozero:theme") || '"system"')
        if (pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
